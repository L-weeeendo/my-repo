<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="../colors.css">
</head>
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        background: var(--body-bg);
        height: 100vh;
        width: 100vw;
    }
    .bod {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 90%;
        height: 500px;
        padding-top: 20px;
        background: var(--bod-bg);
        border: 5px solid var(--bod-bd);
        border-radius: 20px;
        text-align: center;
        box-sizing: border-box;
    }
    .title {
        font-size: 40px;
        font-weight: 500;
        color: var(--bod-bd);
    }
    .todo-list {
        margin-top: 20px;
    }
    .todo {
        background: var(--as-bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        width: 60vw;
        border-radius: 20px;
        border: 5px solid var(--as-bd);
        padding: 20px;
        box-sizing: border-box;
    }
    span {
        display: flex;
    }
    .did {
        height: 20px;
        width: 20px;
        accent-color: var(--as-bd);
    }
    .del {
        color: red;
    }
    .add-name {
        border: 5px solid var(--as-bd);
        height: 60px;
        width: 60vw;
        border-radius: 30px 0 0 30px;
        padding-left: 30px;
        box-sizing: border-box;
        outline: none;
        font-size: 15px;
    }
    .add-todo {
        background: var(--as-bg);
        border: 5px solid var(--as-bd);
        border-radius: 0 30px 30px 0;
        box-sizing: border-box;
        height: 60px;
        width: 80px;
        line-height: 50px;
        text-align: center;
        color: var(--bod-bd);
        font-size: 15px;
    }
    .type {
        margin-top: 20px;
    }
</style>
<body>
    <div class="bod">
        <div class="title">每日待办事项</div>
        <span class="type">
            <input type="text" class="add-name" placeholder="添加待办事项">
            <div class="add-todo" onclick="add()">添加</div>
        </span>
        <div class="todo-list">
            <div class="todo">
                <span>
                    <input type="checkbox" class="did" id="待办事项">
                    <div class="todo-name">待办事项</div>
                </span>
                <div class="del">del</div>
            </div>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
